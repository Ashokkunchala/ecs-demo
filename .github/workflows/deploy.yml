name: Deploy ECS
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_VAR_project_name: ecs-demo
  TF_VAR_environment: dev
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Read ECR repository
        id: ecr
        run: echo "repo=$(aws ecr describe-repositories --repository-names ecs-demo-dev --query 'repositories[0].repositoryUri' --output text)" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        env:
          ECR_REPOSITORY: ${{ steps.ecr.outputs.repo }}
        run: |
          IMAGE="$ECR_REPOSITORY:${GITHUB_SHA}"
          docker build -t "$IMAGE" -t "$ECR_REPOSITORY:latest" .
          docker push "$IMAGE"
          docker push "$ECR_REPOSITORY:latest"
          echo "TF_VAR_container_image=$IMAGE" >> "$GITHUB_ENV"
      - name: Terraform apply
        working-directory: terraform
        run: terraform init -input=false && terraform apply -auto-approve
      - name: Terraform outputs
        working-directory: terraform
        run: terraform output
